name: Build Windows app

# Runs on every push to main (and by hand from the Actions tab).
# Each run publishes a GitHub Release with the Windows zip attached.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win zip --x64 --publish never
      - name: Add the Chinese guide to the zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Compress-Archive -Path docs/使用说明.txt -Update -DestinationPath $zip.FullName
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Clew-windows
          path: dist/*.zip
      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-build.${{ github.run_number }}
          name: Clew ${{ steps.v.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.zip

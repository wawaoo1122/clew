name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win zip --x64 --publish never
      - name: Add the Chinese guide to the zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Compress-Archive -Path docs/使用说明.txt -Update -DestinationPath $zip.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: Clew-windows
          path: dist/*.zip
      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

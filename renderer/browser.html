<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:">
<title>Clew · Browser</title>
<link rel="stylesheet" href="fonts/all.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: 'Inter', 'Microsoft YaHei', system-ui, sans-serif; color: #0A0A0A; }
body { display: flex; flex-direction: column; }
.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid #EBEBEB; background: #fff; }
.bar button { height: 36px; min-width: 36px; padding: 0 10px; border: none; border-radius: 18px; background: #F2F2F2; color: #2A2A2A; font-size: 13px; cursor: pointer; font-family: inherit; }
.bar button:disabled { opacity: 0.4; cursor: default; }
.bar .logo { font-family: 'DM Serif Display', Georgia, serif; font-size: 20px; letter-spacing: 0.04em; padding: 0 6px 0 4px; }
#url { flex: 1 1 auto; min-width: 0; height: 36px; padding: 0 14px; border: none; border-radius: 18px; background: #F2F2F2; font-size: 13px; font-family: inherit; }
#note { flex: 0 1 220px; min-width: 0; height: 36px; padding: 0 14px; border: none; border-radius: 18px; background: #F2F2F2; font-size: 13px; font-family: inherit; }
#log { background: #0A0A0A !important; color: #fff !important; font-weight: 700; padding: 0 18px !important; }
button:focus-visible, input:focus-visible { outline: 2px solid #0A0A0A; outline-offset: 2px; }
webview { flex: 1 1 auto; width: 100%; }
#msg { position: fixed; right: 16px; bottom: 16px; background: #0A0A0A; color: #fff; padding: 9px 16px; border-radius: 18px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#msg.show { opacity: 1; }
.hint { flex: 0 0 auto; padding: 6px 14px; font-size: 12px; color: #6E6E6E; border-bottom: 1px solid #EBEBEB; }
</style>
</head>
<body>
<div class="bar">
  <span class="logo">Clew</span>
  <button type="button" id="back" aria-label="Back">←</button>
  <button type="button" id="fwd" aria-label="Forward">→</button>
  <button type="button" id="reload" aria-label="Reload">↻</button>
  <label for="url" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Address</label>
  <input id="url" placeholder="Type a web address and press Enter">
  <label for="note" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Note</label>
  <input id="note" placeholder="Add a note (optional)">
  <button type="button" id="log">Log this page</button>
</div>
<div class="hint">Log in to WeChat, X, Xiaohongshu or any paid site here once. Clew remembers it, and pasted links from those sites will read properly too.</div>
<webview id="wv" src="about:blank" partition="persist:clew-web" allowpopups></webview>
<div id="msg" role="status" aria-live="polite"></div>
<script src="browser.js"></script>
</body>
</html>
